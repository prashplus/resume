- name: AetherScan
  stack: Next.js, FastAPI, PyTorch, Three.js, Docker
  date: "2026"
  tags: [ai-ml, fullstack]
  bullets:
    - Built a GPU-accelerated 3D reconstruction pipeline with Fast3R and CUDA that converts multi-view images into dense point clouds.
    - Streamed point data over WebSockets as raw Float32Array buffers, bypassing React state to render 1M+ points at 60 FPS.
    - Containerized the multi-service architecture with Docker Compose and NVIDIA Container Toolkit for reproducible GPU deployments.
